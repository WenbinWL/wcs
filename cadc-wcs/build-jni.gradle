import org.gradle.internal.jvm.Jvm

plugins {
    id 'c'
    id 'java'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}
group = 'org.opencadc'
version = '2.2.1'

dependencies {
    implementation 'org.opencadc:cadc-util:[1.12.5,2.0.0)'
    implementation 'org.opencadc:cadc-log:[1.1.3,2.0.0)'

    testImplementation 'junit:junit:[4.13,5.0]'
}

def tmpBuildDir = 'build/tmp'
def baseHeadersDir = "${Jvm.current().javaHome}/include"
def os = System.getProperty("os.name").toLowerCase()
def architecture = System.getProperty("os.arch").toLowerCase()

test {
    systemProperty "java.library.path", "/usr/local/lib:/usr/lib:/usr/lib64:/opt/homebrew/lib:" + System.getProperty("java.io.tmpdir")
}

def getSOFileLocation() {
    def soFile = file('/usr/lib64/libwcs.so')
    if (!soFile.exists()) {
        soFile = file('/usr/lib/libwcs.so')
    }

    if (!soFile.exists()) {
        soFile = file('/usr/local/lib/libwcs.so')
    }

    if (!soFile.exists()) {
        soFile = file('/usr/lib/x86_64-linux-gnu/libwcs.so')
    }

    if (!soFile.exists()) {
        soFile = file('/usr/lib/aarch64-linux-gnu/libwcs.so')
    }

    if (!soFile.exists()) {
        soFile = file('/usr/local/lib/libwcs.dylib')
    }

    if (!soFile.exists()) {
        soFile = file('/opt/homebrew/lib/libwcs.dylib')
    }

    if (!soFile.exists()) {
        throw new Error("No WCS SO file found.")
    }

    return soFile
}

model {
    repositories {
        libs(PrebuiltLibraries) {
           wcsx {
               binaries.withType(SharedLibraryBinary) {
                   // swugly: check for libwcs.so in some places it might be
                   sharedLibraryFile = getSOFileLocation()
               }
           }

            jni {
                if (os.contains("os x")) {
                    headers.srcDirs = [baseHeadersDir, baseHeadersDir + "/darwin", tmpBuildDir]
                } else {
                    headers.srcDirs = [baseHeadersDir, baseHeadersDir + "/linux", tmpBuildDir]
                }
            }
        }
    }

    components {
        wcsLibJNI(NativeLibrarySpec) {

            sources {
                c {
                    lib library: 'jni', linkage: 'api'
                    lib library: 'wcsx', linkage: 'shared'
                }
            }

            // Linux compatible flags only.  This will likely never run on MacOS or Windows due to linkage issues.
            binaries.all {
                if (os.contains("os x")) {
                    cCompiler.args '-mmacosx-version-min=11.0',
                            '-I/opt/homebrew/include',
                            '-I/usr/local/include'
                    linker.args '-mmacosx-version-min=11.0'
                } else {
                    cCompiler.args '-fexceptions',
                            '-ansi',
                            '-std=c99',
                            '-pedantic',
                            '-Wall',
                            '-D_POSIX_C_SOURCE=2',
                            '-D_FILE_OFFSET_BITS=64'
                    if (architecture == 'amd64' || architecture == 'x86_64') {
                        cCompiler.args '-Dx86_linux'
                    }
                }
            }
        }
    }
}

tasks.register('generateJniHeaders', JavaCompile) {
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = file("${tmpBuildDir}")
    source = sourceSets.main.java
    options.compilerArgs += [
            '-h', file("${tmpBuildDir}").absolutePath,
            '-d', file("${tmpBuildDir}").absolutePath
    ]
}

tasks.register('copySharedLibrary', Copy) {
    if (os.contains("os x")) {
        from "${buildDir}/libs/wcsLibJNI/shared/libwcsLibJNI.dylib"        // gradle >= 3
        into file("${buildDir}/classes/java/main/")
    } else {
        from "${buildDir}/libs/wcsLibJNI/shared/libwcsLibJNI.so"           // gradle >= 3
        into file("${buildDir}/classes/java/main/")
    }
}

tasks.register('assembleSharedJar', Jar) {
    from(sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// change the default order of task execution so it does:
// - java compile,
// - javah,
// - .so construction,
// - jar construction
//
jar.enabled = false
classes.dependsOn('generateJniHeaders')
assembleSharedJar.dependsOn('copySharedLibrary')
compileTestJava.dependsOn('copySharedLibrary', 'assembleSharedJar')
